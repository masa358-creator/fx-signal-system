name: FX signal check

on:
  schedule:
    # 30分おきに実行(UTC基準。GitHub Actionsの仕様上、数分の遅延が発生することがあります)
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # 手動実行用ボタンを有効化

permissions:
  contents: write # state.json をコミットし直すために必要

jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: シグナルチェックを実行(18通貨ペア・ランク判定)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FX_SYMBOLS: "USDJPY=X,EURJPY=X,GBPJPY=X,AUDJPY=X,NZDJPY=X,CADJPY=X,CHFJPY=X,EURUSD=X,GBPUSD=X,AUDUSD=X,NZDUSD=X,USDCAD=X,USDCHF=X,EURGBP=X,EURAUD=X,EURCHF=X,GBPCHF=X,AUDNZD=X"
          FX_INTERVAL: "1h"
          FX_PERIOD: "30d"
          LOT_S_RANK: "0.1"  # Sランク(3条件以上一致)のロット数
          LOT_A_RANK: "0.07" # Aランク(2条件一致)のロット数(0.05〜0.1の中間)
        run: python fx_signal_checker.py

      - name: cTraderで発注(S/Aランクのみ発注、Bランクは見送り。SL/TP・発注上限つき)
        env:
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
          CTRADER_ENV: "demo" # デモ口座。live口座で使う場合のみ "live" に変更
          STOP_LOSS_PIPS: "20" # 損切りまでの値幅(pips)
          TAKE_PROFIT_PIPS: "40" # 利確までの値幅(pips)
          MAX_ORDERS_PER_DAY: "10" # 1日の発注件数の上限(安全装置)
          ENABLE_TRADING: "true" # trueにするまでは発注せずログ出力のみ(安全装置)
        run: python ctrader_trader.py

      - name: state.json とステータスページの変更をコミット
        run: |
          git config user.name "fx-signal-bot"
          git config user.email "actions@github.com"
          git add state.json docs/index.html
          [ -f trade_log.json ] && git add trade_log.json
          git diff --staged --quiet || git commit -m "chore: update signal state and status page [skip ci]"
          git push
