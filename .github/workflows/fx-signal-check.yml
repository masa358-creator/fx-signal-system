name: FX signal check

on:
  schedule:
    # 30分おきに実行(UTC基準。GitHub Actionsの仕様上、数分の遅延が発生することがあります)
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # 手動実行用ボタンを有効化

permissions:
  contents: write # state.json をコミットし直すために必要

jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 非公開の状態ファイルを復元(残高・ピークを公開リポジトリに載せないためキャッシュで引き継ぐ)
        uses: actions/cache@v4
        with:
          path: private_state
          key: private-state-${{ github.run_id }}
          restore-keys: private-state-

      - name: シグナルチェックを実行(FX18ペア+暗号資産10ペア。4時間足/日足でトレンド確認)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FX_SYMBOLS: "USDJPY=X,EURJPY=X,GBPJPY=X,AUDJPY=X,NZDJPY=X,CADJPY=X,CHFJPY=X,EURUSD=X,GBPUSD=X,AUDUSD=X,NZDUSD=X,USDCAD=X,USDCHF=X,EURGBP=X,EURAUD=X,EURCHF=X,GBPCHF=X,AUDNZD=X"
          CRYPTO_SYMBOLS: "BTC-USD,ETH-USD,LTC-USD,XRP-USD,BCH-USD,ADA-USD,SOL-USD,BNB-USD,DOT-USD,LINK-USD"
          CRYPTO_TRADABLE_SYMBOLS: "BTCUSD,ETHUSD" # 発注可能な暗号資産(仕様確認済みのみ)
          CRYPTO_LOT_S_RANK: "0.002" # 暗号資産Sランクのロット数(1ロット=1コイン基準)
          CRYPTO_LOT_A_RANK: "0.001" # 暗号資産Aランクのロット数
          FX_INTERVAL: "1h"      # エントリータイミング判定(下位足)
          FX_PERIOD: "30d"       # 1h足の取得期間(4時間足への変換にも利用)
          FX_DAILY_PERIOD: "200d" # 日足トレンド判定用の取得期間
          LOT_S_RANK: "0.02"  # Sランク(3条件以上一致)のロット数=最大ロット
          LOT_A_RANK: "0.01"  # Aランク(2条件一致)のロット数=基本ロット
        run: python fx_signal_checker.py

      - name: cTraderで発注(S/Aランクのみ発注、Bランクは見送り。SL/TP・ポジション数/日次損失上限つき)
        env:
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID }}
          CTRADER_ENV: "live" # ライブ(本番)口座に接続
          ACCOUNT_LABEL: "IC Markets"
          ACCOUNT_CURRENCY: "USD" # この口座はUSD建て(DAILY_LOSS_LIMIT_JPYは円換算して判定)
          USDJPY_RATE: "150"      # 円換算・ロット計算用の概算レート
          RISK_PCT: "0"           # 残高連動ロットは 0=無効。有効化するなら例えば 1(=1回の損切りで残高の1%)
          DD_STOP_PCT: "0"        # ドローダウン自動停止は 0=無効。有効化するなら例えば 15
          DD_RESET_TOKEN: ${{ vars.DD_RESET_TOKEN }} # 停止後の解除用(値を変えると解除)
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STOP_LOSS_PIPS_S: "20" # Sランク(0.02lot)の損切り値幅(≈400円)
          STOP_LOSS_PIPS_A: "40" # Aランク(0.01lot)の損切り値幅(≈400円)
          CRYPTO_STOP_LOSS_PCT: "1.5" # 暗号資産(BTC/ETH)の損切り(価格の%)
          TP_MULTIPLIER: "2"     # 利確幅 = 損切り幅 × 2
          MAX_CONCURRENT_POSITIONS: "3" # 同時保有ポジション数の上限
          MAX_ORDERS_PER_DAY: "10"      # 1日の発注件数の上限
          DAILY_LOSS_LIMIT_JPY: "1000"  # 1日の最大損失(円)。超えたらその日は発注停止
          ENABLE_TRADING: "true" # trueにするまでは発注せずログ出力のみ(安全装置)
        run: python ctrader_trader.py

      - name: cTraderで発注(FxPro口座。小資金のためSランクのFXのみ・0.01lot固定・試運転中)
        # FxPro側でエラーが出ても、IC Marketsの処理と状態コミットは止めない
        continue-on-error: true
        timeout-minutes: 5 # 接続が固まっても他の処理を巻き込まない
        env:
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN_FXPRO }}
          CTRADER_ACCOUNT_ID: ${{ secrets.CTRADER_ACCOUNT_ID_FXPRO }}
          CTRADER_ENV: "live"
          ACCOUNT_LABEL: "FxPro"
          TRADE_LOG_FILE_NAME: "trade_log_fxpro.json"
          ACCOUNT_CURRENCY: "JPY"
          USDJPY_RATE: "150"
          RISK_PCT: "0"               # FORCE_LOT使用中は無視される(残高が増えたらFORCE_LOTを外して有効化)
          DD_STOP_PCT: "0"
          DD_RESET_TOKEN: ${{ vars.DD_RESET_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALLOWED_RANKS: "S"          # 小資金のため、確度の高いSランクのみ
          ALLOWED_ASSET_TYPES: "FX"   # 暗号資産は銘柄仕様が未確認のため対象外
          FORCE_LOT: "0.01"           # 最小ロットに固定(0.02lotだと20pips損切りで約400円=残高の2割)
          STOP_LOSS_PIPS_S: "20"      # 0.01lotで約200円
          TP_MULTIPLIER: "2"
          MAX_CONCURRENT_POSITIONS: "1"
          MAX_ORDERS_PER_DAY: "3"
          DAILY_LOSS_LIMIT_JPY: "300" # 残高約2,000円の15%
          VERIFY_CONNECTION: "true"   # シグナルが無くても接続して残高・銘柄名を確認する(試運転用)
          ENABLE_TRADING: "false"     # 試運転中。ログで残高・銘柄の一致を確認してから "true" に変更する
        run: python ctrader_trader.py

      - name: state.json とステータスページの変更をコミット
        run: |
          git config user.name "fx-signal-bot"
          git config user.email "actions@github.com"
          git add state.json docs/index.html
          # 残高を含む trade_log*.json は公開リポジトリに載せない(private_state/ はキャッシュ経由)
          git diff --staged --quiet || git commit -m "chore: update signal state and status page [skip ci]"
          git push
